name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: pip install tiktoken
      - name: Offline benchmark replay
        run: |
          PY=python3 bench/run.sh "$RUNNER_TEMP/bench" | tee bench.log
          ! grep -q MISSING bench.log
